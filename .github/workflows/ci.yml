name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [unlabeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      bcube_branch:
        description: 'Bcube.jl branch to use for testing'
        required: false
        default: ''


concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Only trigger the job when `draft` label is not assigned to the PR
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    if: contains(github.event.pull_request.labels.*.name, 'draft') == false
    strategy:
      matrix:
        version:
          - '1.11'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for commit message parsing
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      # Determine Bcube branch from workflow_dispatch input or commit message
      - name: Determine Bcube branch
        id: bcube_branch
        run: |
          BRANCH=""

          # Check workflow_dispatch input first
          if [ -n "${{ github.event.inputs.bcube_branch }}" ]; then
            BRANCH="${{ github.event.inputs.bcube_branch }}"
            echo "Using Bcube branch from workflow_dispatch input: $BRANCH"
          # Check commit message for /bcube-branche directive
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.head_commit.message }}" ]; then
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -q "^/bcube-branche "; then
              BRANCH=$(echo "$COMMIT_MSG" | grep "^/bcube-branche " | head -1 | sed 's/^\/bcube-branche //')
              echo "Using Bcube branch from commit message: $BRANCH"
            fi
          # Check PR body for /bcube-branche directive
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.body }}" ]; then
            PR_BODY="${{ github.event.pull_request.body }}"
            if echo "$PR_BODY" | grep -q "^/bcube-branche "; then
              BRANCH=$(echo "$PR_BODY" | grep "^/bcube-branche " | head -1 | sed 's/^\/bcube-branche //')
              echo "Using Bcube branch from PR body: $BRANCH"
            fi
          fi

          if [ -n "$BRANCH" ]; then
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "bcube_branch_detected=true" >> $GITHUB_OUTPUT
          else
            echo "bcube_branch_detected=false" >> $GITHUB_OUTPUT
          fi

      # Install Bcube.jl from the specified branch if provided
      - name: Install Bcube.jl from branch
        if: steps.bcube_branch.outputs.bcube_branch_detected == 'true'
        run: |
          julia -e '
            using Pkg
            bcube_branch = ENV["BCUBE_BRANCH"]
            println("Installing Bcube.jl from branch: ", bcube_branch)
            # Remove existing Bcube entry if present
            if haskey(Pkg.Types.Context().env.manifest, "Bcube")
              Pkg.rm("Bcube")
            end
            # Add Bcube from the specified branch
            Pkg.add(url="https://github.com/bcube-project/Bcube.jl.git", rev=bcube_branch)
          '
        env:
          BCUBE_BRANCH: ${{ steps.bcube_branch.outputs.branch }}

      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@latest
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: lcov.info