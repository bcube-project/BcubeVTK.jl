name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [unlabeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      bcube_branch:
        description: 'Bcube.jl branch to use for testing'
        required: false
        default: ''


concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Only trigger the job when `draft` label is not assigned to the PR
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    if: contains(github.event.pull_request.labels.*.name, 'draft') == false
    strategy:
      matrix:
        version:
          - '1.11'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: "true"
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      # Determine Bcube branch from workflow_dispatch input or commit message
      - name: Determine Bcube branch
        id: bcube_branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SELECTED_BRANCH=""
          if [[ "$PR_BODY" =~ /bcube-branch[[:space:]]+([^[:space:]]+) ]]; then
            SELECTED_BRANCH="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$SELECTED_BRANCH" ]]; then
            LAST_COMMIT_MSG="$(git log -1 --pretty=%B)"
            if [[ "$LAST_COMMIT_MSG" =~ /bcube-branch[[:space:]]+([^[:space:]]+) ]]; then
              SELECTED_BRANCH="${BASH_REMATCH[1]}"
            fi
          fi
          if [[ -n "$SELECTED_BRANCH" ]]; then
            echo "Using custom Bcube branch '$SELECTED_BRANCH'"
            echo "bcube_branch=$SELECTED_BRANCH" >> $GITHUB_OUTPUT
            echo "bcube_branch_detected=true" >> $GITHUB_OUTPUT
          else
            echo "Using registry version of Bcube (no custom branch)"
            echo "bcube_branch_detected=false" >> $GITHUB_OUTPUT
          fi
      # Install Bcube.jl from the specified branch if provided
      - name: Install Bcube.jl from branch
        if: steps.bcube_branch.outputs.bcube_branch_detected == 'true'
        run: |
          julia --project=. -e '
            using Pkg
            bcube_branch = ENV["BCUBE_BRANCH"]
            println("Installing Bcube.jl from branch: ", bcube_branch)
            Pkg.add(url="https://github.com/bcube-project/Bcube.jl.git", rev=bcube_branch)
          '
        env:
          BCUBE_BRANCH: ${{ steps.bcube_branch.outputs.bcube_branch }}

      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@latest
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: lcov.info